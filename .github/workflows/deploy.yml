name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Two pushes must never deploy at once; the second waits for the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build application
        working-directory: ./app
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # The type check inside `next build` passed Node's default ~2 GB heap on 2026-11-13
          # ("JavaScript heap out of memory" during "Running TypeScript"). The runner has far more.
          NODE_OPTIONS: --max-old-space-size=6144

      # STALE-CHUNK PROTECTION (build runs here in CI; .next is scp'd to the server).
      # A deploy replaces .next, so a tab (or cached HTML) from the previous build would request
      # chunk hashes that no longer exist (404 -> ChunkLoadError). To prevent that:
      #   1. "Ship deploy helper" copies app/scripts/deploy-static-archive.sh to the server.
      #   2. "Clean remote directory" first runs `archive`: the OLD build's own .next/static files
      #      are copied to /var/www/citadel/app/.next-archive/<build id>/static (newest 2 kept;
      #      only that folder is ever pruned), and only then is .next removed.
      #   3. "Restart application" runs `merge` after the new .next has landed and before
      #      `pm2 restart`: archived static files are copied into the new .next/static with
      #      cp -n, so a file the new build has is never overwritten.
      # Build id = git sha (next.config.ts generateBuildId), exposed as NEXT_PUBLIC_BUILD_ID.
      - name: Ship deploy helper
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/scripts/deploy-static-archive.sh"
          target: "/var/www/citadel/"
          strip_components: 0

      - name: Clean remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash /var/www/citadel/app/scripts/deploy-static-archive.sh archive
            sudo rm -rf /var/www/citadel/app/.next
            sudo mkdir -p /var/www/citadel/app
            sudo chown -R ubuntu:ubuntu /var/www/citadel

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/.next/,app/public/,app/package.json,app/package-lock.json,app/prisma/"
          target: "/var/www/citadel/"
          strip_components: 0

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/citadel/app
            bash /var/www/citadel/app/scripts/deploy-static-archive.sh merge
            npm ci --production
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart citadel

      # UPLOAD SIZE. nginx sits in front of the app and refuses any request body over 1 MB unless told
      # otherwise, which stopped designers uploading their own designs (the app allows 25 MB; found
      # 2026-11-17). This writes one drop-in file, tests the nginx config, and removes the file again if
      # the test fails, so a bad setting can never stop nginx. It runs after the app has restarted and
      # never fails the deploy (continue-on-error): a red step here means "limit not raised", nothing else.
      # To undo: sudo rm /etc/nginx/conf.d/citadel-upload-limit.conf && sudo nginx -t && sudo systemctl reload nginx
      - name: Set the upload size limit on the web server
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -u
            CONF=/etc/nginx/conf.d/citadel-upload-limit.conf
            LINE='client_max_body_size 26m;'
            if [ -f "$CONF" ] && grep -qxF "$LINE" "$CONF"; then
              # Reload again in case an earlier reload did not take; it costs nothing when nothing changed.
              if sudo nginx -t && sudo systemctl reload nginx; then
                echo "Upload limit already set; nginx reloaded."
                exit 0
              fi
              echo "Upload limit file is in place but nginx did not reload."
              exit 1
            fi
            if [ ! -f "$CONF" ] && ! sudo nginx -t; then
              echo "The nginx config does not pass its own test before any change. Leaving it alone."
              exit 1
            fi
            FULL="$(sudo nginx -T 2>/dev/null)"
            echo "Sites this nginx serves:"
            printf '%s\n' "$FULL" | grep -E '^[[:space:]]*server_name' | sort -u
            # Any setting outside our own file would override ours or clash with it, so leave the config alone.
            OTHER="$(printf '%s\n' "$FULL" | awk -v own="# configuration file $CONF:" '
              /^# configuration file / { file = $0; mine = ($0 == own); next }
              !mine && $0 !~ /^[[:space:]]*#/ && /client_max_body_size/ { print file " " $0 }')"
            if [ -n "$OTHER" ]; then
              echo "A client_max_body_size is already set elsewhere in the nginx config. Not adding a second one:"
              printf '%s\n' "$OTHER"
              exit 1
            fi
            if ! printf '# Written by the Citadel deploy (.github/workflows/deploy.yml). The app allows uploads up to 25 MB.\n%s\n' "$LINE" | sudo tee "$CONF" > /dev/null; then
              echo "Could not write $CONF."
              exit 1
            fi
            if ! sudo nginx -t; then
              sudo rm -f "$CONF"
              sudo nginx -t && echo "The new setting failed the config test and was removed. nginx is unchanged."
              exit 1
            fi
            if ! sudo nginx -T 2>/dev/null | grep -qxF "# configuration file $CONF:"; then
              sudo rm -f "$CONF"
              echo "This nginx does not load /etc/nginx/conf.d, so the file was removed. nginx is unchanged."
              exit 1
            fi
            if sudo systemctl reload nginx; then
              echo "Upload limit set to 26 MB and nginx reloaded."
            else
              echo "Upload limit file written and it passes the config test, but nginx did not reload."
              exit 1
            fi

      # If any step above failed, surface it as a CRITICAL Citadel task for Mike
      # so a broken deploy lands in front of a human, not just in a CI log.
      # Requires the CITADEL_API_TOKEN secret (task-create scope). If the secret
      # is absent the step warns and exits 0 — the failed deploy itself is already
      # red, so we never mask the real failure.
      - name: Report deploy failure to Citadel
        if: failure()
        env:
          CITADEL_API_TOKEN: ${{ secrets.CITADEL_API_TOKEN }}
        run: |
          if [ -z "$CITADEL_API_TOKEN" ]; then
            echo "::warning::CITADEL_API_TOKEN not set — cannot create the Citadel deploy-failure task. Add the secret to enable this alert."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DESC=$(printf '### Production deploy FAILED\n\nThe deploy workflow failed before the app was restarted cleanly. A failed/stale Prisma migration now FAILS the deploy (the silent `db push` fallback was removed), so check the migration state first.\n\n- **Commit:** `%s`\n- **Branch:** `%s`\n- **Run:** [View the failed run](%s)\n\n**Remediation:** SSH to prod and run `npx prisma migrate status` in `/var/www/citadel/app`; resolve a failed migration per the 173beeb2 runbook, then re-run the deploy.' "$SHORT_SHA" "$GITHUB_REF_NAME" "$RUN_URL")
          PAYLOAD=$(jq -n \
            --arg title "[Deploy FAILED] ${SHORT_SHA} on ${GITHUB_REF_NAME}" \
            --arg desc "$DESC" \
            '{
              title: $title,
              description: $desc,
              assignee_id: "3ecfb7be-20bb-43cb-9b4d-31c44337dc81",
              site_id: "d9d627d8-ccb4-46c7-8319-cdd87cd4e8bf",
              priority: 1,
              source: "internal",
              tags: ["deploy-failure", "ci-failure", "needs-mike"]
            }')
          HTTP=$(curl -s -o /tmp/citadel-resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CITADEL_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://citadel.becomeindelible.com/api/tasks)
          echo "Citadel API responded: HTTP $HTTP"
          cat /tmp/citadel-resp.json || true
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::Failed to create Citadel deploy-failure task (HTTP $HTTP)"
            exit 1
          fi
          echo "Created Citadel deploy-failure task for Mike."
